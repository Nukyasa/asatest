<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASA · Specifikacije računara</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#10223c;background:#eef4fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eaf3ff,#f8fbff 45%,#edf3f9);min-height:100vh}.wrap{width:min(1240px,calc(100% - 32px));margin:auto;padding:24px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px;color:#10223c;text-decoration:none}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;background:linear-gradient(145deg,#2488e5,#143d83);font-weight:900}.brand b{display:block;font-size:17px}.brand small{color:#71839b;font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid #cbd9e8;border-radius:10px;background:#fff;color:#1c4e83;padding:10px 14px;font-weight:750;cursor:pointer}.btn.primary{border-color:#1768bd;color:#fff;background:#1768bd;box-shadow:0 8px 20px #1768bd30}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.eyebrow{margin:0 0 8px;color:#2274c4;font-size:11px;font-weight:850;letter-spacing:.14em}.hero h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:-.045em}.hero p{margin:10px 0 0;color:#62748a}.updated{color:#71839b;font-size:12px;text-align:right}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.metric,.panel{background:#fff;border:1px solid #dce7f2;border-radius:18px;box-shadow:0 12px 35px #274c7514}.metric{padding:18px}.metric span{color:#71839b;font-size:12px;font-weight:700}.metric strong{display:block;margin:3px 0;font-size:30px}.metric small{color:#8293a8}.toolbar{display:flex;gap:10px;margin-bottom:18px}.search{flex:1;min-height:44px;border:1px solid #cbd9e8;border-radius:11px;padding:0 14px;background:#fff;color:#10223c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{padding:18px;text-align:left;border:1px solid #d8e4f0;border-radius:18px;background:#fff;box-shadow:0 10px 28px #274c7512;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#73afe4;box-shadow:0 18px 36px #2476b326}.card-head{display:flex;justify-content:space-between;gap:12px}.card h3{margin:0;font-size:17px}.badge{padding:5px 8px;border-radius:999px;background:#e7f4ed;color:#197148;font-size:10px;font-weight:800}.sub{margin:5px 0 15px;color:#71839b;font-size:12px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{padding:9px;border-radius:10px;background:#f3f7fb}.spec span{display:block;color:#8293a8;font-size:10px}.spec b{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.empty{padding:45px;text-align:center;color:#71839b}.login{max-width:450px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #dce7f2;border-radius:22px;box-shadow:0 20px 55px #183a601c}.login h1{margin:0 0 8px}.login p{color:#71839b}.login input{width:100%;margin:12px 0;padding:13px;border:1px solid #cbd9e8;border-radius:10px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#07162bb5;z-index:3}.modal.open{display:flex}.dialog{width:min(900px,100%);max-height:92vh;overflow:auto;padding:24px;background:#fff;border-radius:20px}.dialog-head{display:flex;justify-content:space-between;gap:20px}.dialog h2{margin:0}.close{border:0;background:#edf3f9;border-radius:9px;font-size:20px;width:38px;height:38px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.detail{padding:13px;border:1px solid #e0e9f2;border-radius:12px}.detail span{display:block;color:#8293a8;font-size:11px}.detail b{display:block;margin-top:4px;overflow-wrap:anywhere}.history{border-top:1px solid #e0e9f2;padding-top:18px}.history h3{margin:0 0 12px}.event{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eef3f7}.dot{width:9px;height:9px;margin-top:5px;border-radius:50%;background:#2d83d7}.event div{flex:1}.event small{display:block;color:#71839b;margin-top:3px}.changes{margin-top:15px;padding:12px;border-radius:12px;background:#f2f7fc}.change{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px}.change span{color:#71839b;text-align:right}.error{color:#b33a3a;font-size:13px}
@media(max-width:700px){.wrap{width:min(100% - 22px,1240px);padding-top:15px}.top{align-items:flex-start}.actions .btn:first-child{display:none}.hero{display:block}.updated{text-align:left;margin-top:12px}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:span 2}.detail-grid{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><article class="dialog"><div class="dialog-head"><div><p class="eyebrow">SPECIFIKACIJA RAČUNARA</p><h2 id="detail-title"></h2><p class="sub" id="detail-sub"></p></div><button class="close" id="close">×</button></div><div class="detail-grid" id="detail-grid"></div><section class="history"><h3>Historija ažuriranja</h3><div id="changes"></div><div id="events"></div></section></article></div><script>
const API='https://asacentralracunari.amina-pribisic.chatgpt.site';let key=sessionStorage.getItem('asa-key')||'',reports=[],root=document.getElementById('root');const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>{const d=new Date(v);return isNaN(d)?(v||'—'):new Intl.DateTimeFormat('bs-BA',{dateStyle:'medium',timeStyle:'short'}).format(d)};const req=async(path)=>{const join=path.includes('?')?'&':'?';const r=await fetch(API+path+join+'key='+encodeURIComponent(key));if(r.status===401)throw Error('Administratorski ključ nije ispravan.');if(!r.ok)throw Error('Podaci nisu dostupni.');return r.json()};
function login(error=''){root.innerHTML=`<main class="login"><div class="logo">ASA</div><p class="eyebrow">CENTRALNA EVIDENCIJA</p><h1>Specifikacije računara</h1><p>Prijavite se za pregled uređaja, mreže, memorije i historije promjena.</p><input id="key" type="password" placeholder="Administratorski ključ"><button class="btn primary" id="enter">Otvori pregled</button><p class="error">${esc(error)}</p></main>`;document.getElementById('enter').onclick=async()=>{key=document.getElementById('key').value.trim();if(!key)return;try{await load()}catch(e){login(e.message)}};}
async function load(){const [sum,list]=await Promise.all([req('/api/dashboard/summary'),req('/api/dashboard/reports?limit=500')]);sessionStorage.setItem('asa-key',key);reports=list;render(sum)}
function render(sum){root.innerHTML=`<main class="wrap"><header class="top"><a class="brand" href="./"><span class="logo">ASA</span><span><b>Central Računari</b><small>Specifikacije i historija uređaja</small></span></a><div class="actions"><button class="btn" id="refresh">Osvježi</button><button class="btn" id="logout">Odjava</button></div></header><section class="hero"><div><p class="eyebrow">PREGLED UREĐAJA</p><h1>Specifikacije računara</h1><p>Jedan karton po računaru. Svako novo slanje čuva se kao ažuriranje u historiji.</p></div><div class="updated">Posljednje osvježavanje<br><b>${fmt(new Date())}</b></div></section><section class="metrics"><article class="metric"><span>RAČUNARI</span><strong>${sum.totalComputers}</strong><small>jedinstvenih uređaja</small></article><article class="metric"><span>AZURIRANJA</span><strong>${sum.totalRuns}</strong><small>sačuvanih stanja</small></article><article class="metric"><span>AKTIVNI PREGLED</span><strong>100%</strong><small>specifikacije · historija</small></article></section><section class="panel" style="padding:16px"><div class="toolbar"><input class="search" id="search" placeholder="Pretraži naziv, korisnika, model ili serijski broj"><button class="btn primary" id="all">Svi računari</button></div><div class="grid" id="grid"></div></section></main>`;document.getElementById('refresh').onclick=()=>load().catch(e=>login(e.message));document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('asa-key');key='';login()};document.getElementById('search').oninput=e=>cards(e.target.value);cards('')}
function cards(q){const needle=q.toLowerCase();const list=reports.filter(r=>`${r.machineName} ${r.displayName||''} ${r.userName||''} ${r.model||''} ${r.deviceKey||''}`.toLowerCase().includes(needle));document.getElementById('grid').innerHTML=list.length?list.map(r=>`<button class="card" data-id="${esc(r.reportId)}"><div class="card-head"><h3>${esc(r.displayName||r.machineName)}</h3><span class="badge">${r.historyCount||1} ažuriranja</span></div><p class="sub">${esc(r.userName||'Korisnik nije naveden')} · ${esc(r.model||'Model nije naveden')}</p><div class="specs"><div class="spec"><span>RAM</span><b>${esc(r.totalMemory)}</b></div><div class="spec"><span>AnyDesk</span><b>${esc(r.anyDeskId)}</b></div><div class="spec"><span>Proizvođač</span><b>${esc(r.manufacturer)}</b></div><div class="spec"><span>Zadnje ažuriranje</span><b>${esc(fmt(r.finishedUtc))}</b></div></div></button>`).join(''):`<div class="empty">Nema pronađenih računara.</div>`;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>detail(x.dataset.id))}
async function detail(id){const r=await req('/api/dashboard/reports/'+encodeURIComponent(id));document.getElementById('detail-title').textContent=r.displayName||r.machineName;document.getElementById('detail-sub').textContent=`${r.machineName} · ${r.hardware?.userName||'Korisnik nije naveden'} · zadnje ažuriranje ${fmt(r.finishedUtc)}`;const h=r.hardware||{};document.getElementById('detail-grid').innerHTML=[['Proizvođač',h.manufacturer],['Model',h.model],['Serijski broj',h.serialNumber],['Windows',h.windowsVersion],['Arhitektura',h.architecture],['RAM',h.totalMemory],['AnyDesk ID',h.anyDeskId],['IP adrese',(h.networkAdapters||[]).flatMap(a=>a.ipAddresses||[]).join(', ')||'—'],['Mrežni adapteri',(h.networkAdapters||[]).length],['Povezani uređaji',(h.connectedDevices||[]).length]].map(([a,b])=>`<div class="detail"><span>${a}</span><b>${esc(b)}</b></div>`).join('');document.getElementById('changes').innerHTML=(r.changes||[]).map(c=>`<div class="change"><b>${esc(c.label)}</b><span>${esc(c.before?c.before+' → ':'')}${esc(c.after)}</span></div>`).join('')||'<small>Nema promjena u odnosu na prethodno stanje.</small>';document.getElementById('events').innerHTML=(r.history||[]).map((e,i)=>`<div class="event"><i class="dot"></i><div><b>${i?'Prethodno stanje':'Trenutno stanje'}</b><small>${fmt(e.finishedUtc)} · verzija ${esc(e.version)} · ${e.changeCount||0} promjena</small></div></div>`).join('');document.getElementById('modal').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};if(key)load().catch(e=>login(e.message));else login();
</script></body></html>
