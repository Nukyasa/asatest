<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730"><title>ASA Central Računari</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#edf5ff;background:#071326}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% -10%,#1d4b86 0,#0b1730 40%,#050b17 100%)}body{padding:14px}.shell{width:min(1560px,100%);margin:auto;min-height:calc(100vh - 28px);display:flex;flex-direction:column;border:1px solid rgba(164,198,236,.18);border-radius:22px;overflow:hidden;background:rgba(8,20,40,.74);box-shadow:0 28px 90px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid rgba(164,198,236,.16);background:rgba(8,22,43,.88)}.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#57a8ff,#1554a5);font-weight:900;letter-spacing:-.08em;box-shadow:0 8px 22px rgba(46,131,231,.3)}.brand strong{display:block;font-size:15px}.brand small{display:block;margin-top:2px;color:#91a8c6;font-size:11px}.actions{display:flex;align-items:center;gap:8px}.status{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(96,204,151,.25);border-radius:999px;color:#b5f3d1;font-size:12px;font-weight:700;background:rgba(39,139,91,.13)}.status i{width:7px;height:7px;border-radius:50%;background:#5de39a;box-shadow:0 0 0 4px rgba(93,227,154,.12)}button,.open{border:1px solid rgba(164,198,236,.2);border-radius:10px;padding:9px 12px;color:#e9f3ff;background:rgba(255,255,255,.07);font:600 12px inherit;text-decoration:none;cursor:pointer;transition:.18s ease}button:hover,.open:hover{border-color:#69adf4;background:rgba(87,168,255,.16);transform:translateY(-1px)}.frame-wrap{position:relative;flex:1;min-height:calc(100vh - 116px);background:#f7f9fc}.frame-wrap iframe{display:block;width:100%;height:100%;min-height:calc(100vh - 116px);border:0;background:#f7f9fc}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:linear-gradient(135deg,#091a33,#102c52);transition:opacity .35s ease}.loading.hide{opacity:0;pointer-events:none}.loader{text-align:center;color:#dcecff}.spinner{width:36px;height:36px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.22);border-top-color:#66b0ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading p{margin:0;font-size:13px;color:#9ab6d7}.note{padding:8px 16px;text-align:center;color:#7e98b9;font-size:11px;background:#07162b;border-top:1px solid rgba(164,198,236,.12)}@media(max-width:700px){body{padding:0}.shell{min-height:100vh;border:0;border-radius:0}.bar{padding:12px}.status{display:none}.brand small{font-size:10px}.open{padding:8px}.frame-wrap,.frame-wrap iframe{min-height:calc(100vh - 98px)}.note{display:none}}
</style></head><body><div class="shell"><header class="bar"><a class="brand" href="./" aria-label="ASA Central Računari početna"><span class="logo">ASA</span><span><strong>Central Računari</strong><small>Inventar · izvještaji · historija</small></span></a><div class="actions"><span class="status"><i></i>Sistem aktivan</span><button id="refresh" type="button">Osvježi</button><a class="open" href="https://asacentralracunari.amina-pribisic.chatgpt.site/" target="_blank" rel="noopener">Otvori aplikaciju</a></div></header><main class="frame-wrap"><div class="loading" id="loading"><div class="loader"><div class="spinner"></div><p>Učitavam ASA Central Računari…</p></div></div><iframe id="app" src="https://asacentralracunari.amina-pribisic.chatgpt.site/" title="ASA Central Računari aplikacija" allow="fullscreen"></iframe></main><div class="note">Sigurna centralna evidencija računara · GitHub Pages</div></div><script>const frame=document.getElementById('app'),loading=document.getElementById('loading');frame.addEventListener('load',()=>window.setTimeout(()=>loading.classList.add('hide'),250));document.getElementById('refresh').addEventListener('click',()=>{loading.classList.remove('hide');frame.src=frame.src.split('#')[0]+'?refresh='+Date.now()});</script></body></html>
